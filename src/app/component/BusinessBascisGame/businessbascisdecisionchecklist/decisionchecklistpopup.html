
<div class="card decisionchecklistpopup" [ngClass]="data.class?data.class:''">
    <div class="loadingscreenforpopup" *ngIf="checkloading">
        <span class="spinner-border spinner-border-sm loadingspinnerpopup" role="status" aria-hidden="true"></span>
        <p class="loadingspinnertxtpopup">Loading... Brewing up some digital magic! </p>
    
    </div>
    <div class="card-header decisionchecklistpopup-card-header">
        <div>
            <p class="decisionchecklistpopup-card-header-pclass">Help</p>
        </div>
        <div>
            <i class="bi bi-x-circle cross-circle" (click)="close()"></i>
        </div>
    </div>
    <div class="card-body">
        <p>
            “You are submitting your decisions as the final decision. Do you want to save and proceed with
            reports?”
        </p>
    </div>
    <div class="card-footer decisionchecklistpopup-card-footer py-3">
        <div><button type="button" class=" close_btn" mat-dialog-close>Close</button></div>
        <div><button type="button" class=" save_btn" (click)="save()">Save & Proceed</button></div>
        
    </div>

</div>
