

<div class="loadingscreen" *ngIf="checkloading">
  <span class="spinner-border spinner-border-sm loadingspinner" role="status" aria-hidden="true"></span>
  <p class="loadingspinnertxt">Loading... Brewing up some digital magic! </p>
</div>
<div class="card logout-popup-not">
  

  <div class="card-header logout-popup-not-cardhead">
      <span>
          Copy </span>
      <i class="bi bi-x-lg" mat-dialog-close></i>

  </div>

  <div class="card-body logout-popup-not-cardhead-cardbody">
      <div *ngIf="data.casename==='sharedcase'">
          <div class="lebel pb-1">Description :</div>
          <p  style="background-color: #f2f2f2;padding: 5px; max-height: 10rem; overflow: auto; text-align: justify;">{{data.card.shareddescription}}</p>

          <div class="pb-2 d-flex" >
              Author Name : <p style="margin-bottom: 0;padding-left: 4px;">{{data.card.courseDetails.instructorname}}</p>
          </div>
      </div>

      <form class="form" [formGroup]="myForm">

          <div class="label pb-1" >Enter a name for the copied case</div>
          <div class="form-group">
              <div class="input-group">

                  <input type="text" class="form-control" placeholder="" formControlName="coursename" />
              </div>
              <span class="form-text text-muted"></span>
          </div>

      </form>
  </div>


  <div class="card-footer pt-4 logout-popup-not-cardhead-cardfooter">
      <button type="reset" class="btn-yes" (click)="CopyGame()" [disabled]="isButtonDisabled">Copy</button>
      <button type="reset" class="btn-no" mat-dialog-close>Cancel</button>
  </div>
</div>
