<div class="dialog-container" role="dialog" aria-labelledby="dialog-title">
  <h2 id="dialog-title" mat-dialog-title>Set as Primary Course</h2>

  <mat-dialog-content>
    <p>Are you sure you want to set this course as primary?</p>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="dialogRef.close()" aria-label="Cancel">
      Cancel
    </button>

    <button mat-raised-button color="primary" (click)="primaryselect()" aria-label="Confirm">
      Confirm
    </button>
  </mat-dialog-actions>
</div>
