<div class="elearingnewui">
    <div class="case-management-body-forheader">
        <div class="returnbtn-element">
            <div class="returnbtn" (click)="GoBack()"> Return to Case Management </div>
        </div>
        <div class="card case-management-body-card">
            <div class="card-body">
                <div class=" tab-content-body">
                    <ul class="nav second-nav" role="tablist">
                        <li class="nav-item active" role="presentation" data-bs-target="#outlook" data-bs-toggle="tab"
                            aria-controls="outlook" role="tab" aria-selected="false" (click)="search('outlook')">
                            <span class="nav-link" aria-current="page">Market</span>
                        </li>
                        <li class="nav-item" role="presentation" data-bs-target="#location" data-bs-toggle="tab"
                            aria-controls="location" role="tab" aria-selected="false" (click)="search('location')">
                            <span class="nav-link" aria-current="page">Demand</span>
                        </li>
                        <li class="nav-item" role="presentation" data-bs-target="#demand" data-bs-toggle="tab"
                            aria-controls="demand" role="tab" aria-selected="false" (click)="search('demand')">
                            <span class="nav-link" aria-current="page">Production</span>
                        </li>
                        <li class="nav-item" role="presentation" data-bs-target="#investment" data-bs-toggle="tab"
                            aria-controls="investment" role="tab" aria-selected="false" (click)="search('investment')">
                            <span class="nav-link" aria-current="page">Marketing</span>
                        </li>
                        <li class="nav-item" role="presentation" data-bs-target="#marketing" data-bs-toggle="tab"
                            aria-controls="marketing" role="tab" aria-selected="false" (click)="search('marketing')">
                            <span class="nav-link" aria-current="page">Finance</span>
                        </li>
                        <li class="nav-item" role="presentation" data-bs-target="#foodrforthought" data-bs-toggle="tab"
                            aria-controls="foodrforthought" role="tab" aria-selected="false"
                            (click)="search('foodforthought')">
                            <span class="nav-link" aria-current="page">Food For Thought</span>
                        </li>
                        <li class="nav-item" role="presentation" data-bs-target="#module" data-bs-toggle="tab"
                            aria-controls="module" role="tab" aria-selected="false" (click)="search('general')">
                            <span class="nav-link" aria-current="page">Module</span>
                        </li>

                    </ul>
                </div>
                <div class="tab-content tab-content-body">

                    <div role="tabpanel" class="tab-pane fade show active" id="outlook"
                        [ngClass]="{ 'active':activeTab==='outlook'}">
                        <app-valuechaincasemarket *ngIf="activeTab==='outlook'"></app-valuechaincasemarket>
                    </div>
                    <div role="tabpanel" class="tab-pane fade show " id="location"
                        [ngClass]="{ 'active':activeTab==='location'}">
                        <app-valuechaincasedemand *ngIf="activeTab==='location'"></app-valuechaincasedemand>
                    </div>
                    <div role="tabpanel" class="tab-pane fade show " id="demand"
                        [ngClass]="{ 'active':activeTab==='demand'}">
                        <app-valuechaincaseproduction *ngIf="activeTab==='demand'"></app-valuechaincaseproduction>
                    </div>
                    <div role="tabpanel" class="tab-pane fade show " id="investment"
                        [ngClass]="{ 'active':activeTab==='investment'}">
                        <app-valuechaincasemarketing *ngIf="activeTab==='investment'"></app-valuechaincasemarketing>
                    </div>
                    <div role="tabpanel" class="tab-pane fade show " id="marketing"
                        [ngClass]="{ 'active':activeTab==='marketing'}">
                        <app-valuechaincasefinance *ngIf="activeTab==='marketing'"></app-valuechaincasefinance>
                    </div>
                    <div role="tabpanel" class="tab-pane fade show " id="foodrforthought"
                        [ngClass]="{ 'active':activeTab==='foodforthought'}">
                        <app-valuechaincasefoodforthought
                            *ngIf="activeTab==='foodforthought'"></app-valuechaincasefoodforthought>
                    </div>
                    <div role="tabpanel" class="tab-pane fade show " id="module"
                        [ngClass]="{ 'active':activeTab==='general'}">
                        <app-valuechaincasemodule *ngIf="activeTab==='general'"></app-valuechaincasemodule>
                    </div>
                </div>
            </div>
        </div>
        <!-- <div>
            <button class="mt-4 back" (click)="back()" style=" border: 3px solid #30b4cc;
            border-radius: 6px;
            background: transparent;
            color: #30b4cc;
            font-size: 20px; padding: 0.5rem 1rem;">Back</button>
        </div> -->
    </div>
</div>
