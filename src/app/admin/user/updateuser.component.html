

<div class="p-4">
    <div class="row">
        <div class="col-10">
            <div class="inputtitle">Update License No & Credit No </div>
            <div class="subtitle">You can update License No & Credit No with respective details</div>
        </div>
    </div>
    <form [formGroup]="createcoursegroup" class="form">
        <div class="row" >
            <div class="borderbottom"></div>
            <div class="col-6 mar-b">
                <div class="lebel">Licenses No. </div>
                <input formControlName="nooflicense" class="form-control" type="number">
            </div>
            <div class="col-6 mar-b">
                <div class="lebel">Credit No. </div>
                <input formControlName="aicreditmicrosim" class="form-control" type="number">
            </div>
            <div class="col-4"></div>
            <div class="col-2 mar-b save" style="display:flex;align-items:center">
                <button [disabled]="checkloading || isButtonDisabled" class="submit-button" (click)="update()" >Update</button>
            </div>
        </div>
    </form>       
</div>
