<div>
  <div class="card logout-popup-not">
      <div class="card-header logout-popup-not-cardhead">
          <span>Participant Password</span>
          <i class="bi bi-x-circle" mat-dialog-close></i>
      </div>
      <div class="card-body">
          <p>{{message}}</p>
          <form [formGroup]="createuserpasswordgroup" class="form">
              <div class="row">
                  <div class="borderbottom"></div>
                  <div class="col-6 mar-b">
                      <div class="lebel">Password </div>
                      <input formControlName="password" class="form-control" type="password">
                  </div>
                  <div class="col-4"></div>
              </div>
          </form>
      </div>
      <div class="card-footer logout-popup-not-cardhead-cardfooter">
          <button class="btn-yes" (click)="passwordUpdate()">Save</button>
          <button class="btn-no" mat-dialog-close>Cancel</button>
      </div>
  </div>
</div>
