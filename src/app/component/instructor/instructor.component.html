

<div class="elearingnewui">
    <div class="login-body">
        <div class="card login-card">
            <div class="logo-elem">
                <img src="../../../assets/images/cesim_logo_new.svg" class="img-fluid">
            </div>
            <div class="row row-cols-md-2 h-100" (keydown)="handleKeydown($event)">
                <div class="col-md-7">
                    <div class="form-div" (keyup.enter)="login()" [formGroup]="instructorlogingroup" >
                        <h1>Login</h1>
                        <mat-form-field appearance="outline" class="mt-3 mb-2">
                            <mat-label>Email</mat-label>
                            <input matInput placeholder="Email" formControlName="email" 
                            #input [value]="input.value.toLowerCase()"
                             pattern="[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,20}">
                        </mat-form-field>
                        <mat-form-field appearance="outline" class="mb-3">
                            <mat-label>Password</mat-label>
                            <input matInput placeholder="Password" 
                            formControlName="password" type="password">
                        </mat-form-field>
                        <button type="submit" class="login-sub " (click)="login()">Login</button>
                        <a class="form-p" (click)="forgotpassword()">Forgot password?</a>
                    </div>
                </div>
                <div class="col-md-5">
                    <div class="img-term">
                        <div class="img-term-elemt">
                            <p>Experiential learning with next-generation interactive simulations</p>
                            <!-- <button class="img-term-btn mt-2" (click)="studentsignup()">Click here to register</button> -->
                        </div>

                    </div>
                </div>
            </div>
        </div>
        <div class="title-body">
            <a href="mailto:support@cesim.in" target="_self" style="text-decoration:none; color:inherit">
                <p>If you are an instructor and would like to register, please click here.</p></a>
        </div>

    </div>
</div>
