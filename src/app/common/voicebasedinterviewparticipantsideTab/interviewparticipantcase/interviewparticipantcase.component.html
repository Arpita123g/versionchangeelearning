<div class="case-container">
  <mat-card class="case-card">
    <mat-card-header>
      <mat-card-title>Interview Case</mat-card-title>
    </mat-card-header>
    
    <mat-card-content>
      <div class="case-content" *ngIf="!isLoading(); else loading">
        <div *ngIf="caseData(); else noData">
          <!-- Add your case data display here -->
          <p>Case data will be displayed here</p>
        </div>
        <ng-template #noData>
          <p>No case data available</p>
        </ng-template>
      </div>
      <ng-template #loading>
        <div class="loading-spinner">
          <mat-spinner diameter="40"></mat-spinner>
        </div>
      </ng-template>
    </mat-card-content>
  </mat-card>
</div>
