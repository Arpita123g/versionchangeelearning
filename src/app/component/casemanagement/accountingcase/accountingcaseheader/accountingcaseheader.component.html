<div class="elearingnewui">
    <div class="case-management-body-forheader">
        <div class="returnbtn-element">
            <div class="returnbtn" (click)="GoBack()"> Return to Case Management </div>
        </div>
        <div class="card case-management-body-card">
            <div class="card-body">
                <div class=" tab-content-body">
                    <ul class="nav second-nav" role="tablist">
                        <li class="nav-item active" role="presentation" data-bs-target="#memo" data-bs-toggle="tab"
                            aria-controls="memo" role="tab" aria-selected="false" (click)="search('memo')">
                            <span class="nav-link" aria-current="page">Memo</span>
                        </li>
                        <!-- <li class="nav-item " role="presentation" data-bs-target="#information" data-bs-toggle="tab"
                            aria-controls="information" role="tab" aria-selected="false"
                            (click)="search('information')">
                            <span class="nav-link" aria-current="page">Information</span>
                        </li> -->
                        <li class="nav-item " role="presentation" data-bs-target="#accounts" data-bs-toggle="tab"
                            aria-controls="accounts" role="tab" aria-selected="false" (click)="search('accounts')">
                            <span class="nav-link" aria-current="page">Correct Accounts</span>
                        </li>
                        <li class="nav-item " role="presentation" data-bs-target="#evaluation" data-bs-toggle="tab"
                            aria-controls="evaluation" role="tab" aria-selected="false" (click)="search('evaluation')">
                            <span class="nav-link" aria-current="page">Evaluation</span>
                        </li>
                        <li class="nav-item" role="presentation" data-bs-target="#foodrforthought" data-bs-toggle="tab"
                            aria-controls="foodrforthought" role="tab" aria-selected="false"
                            (click)="search('foodforthought')">
                            <span class="nav-link" aria-current="page">Food For Thought</span>
                        </li>
                        <li class="nav-item" role="presentation" data-bs-target="#module" data-bs-toggle="tab"
                            aria-controls="module" role="tab" aria-selected="false" (click)="search('general')">
                            <span class="nav-link" aria-current="page">Module</span>
                        </li>

                    </ul>
                </div>
                <div class="tab-content tab-content-body">

                    <div role="tabpanel" class="tab-pane fade show active" id="memo"
                        [ngClass]="{ 'active':activeTab==='memo'}">
                        <app-accountingcasememo *ngIf="activeTab==='memo'"></app-accountingcasememo>
                    </div>
                    <!-- <div role="tabpanel" class="tab-pane fade show " id="information"
                        [ngClass]="{ 'active':activeTab==='information'}">
                        <app-accountingcaseinformation
                            *ngIf="activeTab==='information'"></app-accountingcaseinformation>
                    </div> -->
                    <div role="tabpanel" class="tab-pane fade show " id="accounts"
                        [ngClass]="{ 'active':activeTab==='accounts'}">
                        <app-accountingcasecorrectaccounts
                            *ngIf="activeTab==='accounts'"></app-accountingcasecorrectaccounts>
                    </div>
                    <div role="tabpanel" class="tab-pane fade show " id="evaluation"
                        [ngClass]="{ 'active':activeTab==='evaluation'}">
                        <app-accountingcaseevaluation *ngIf="activeTab==='evaluation'"></app-accountingcaseevaluation>
                    </div>

                    <div role="tabpanel" class="tab-pane fade show " id="foodrforthought"
                        [ngClass]="{ 'active':activeTab==='foodforthought'}">
                        <app-accountingcasefoodforthought
                            *ngIf="activeTab==='foodforthought'"></app-accountingcasefoodforthought>
                    </div>
                    <div role="tabpanel" class="tab-pane fade show " id="module"
                        [ngClass]="{ 'active':activeTab==='general'}">
                        <app-accountingcasemodule *ngIf="activeTab==='general'"></app-accountingcasemodule>
                    </div>
                </div>
            </div>
        </div>
        <!-- <div>
            <button class="mt-4 back" (click)="back()" style=" border: 3px solid #30b4cc;
            border-radius: 6px;
            background: transparent;
            color: #30b4cc;
            font-size: 20px; padding: 0.5rem 1rem;">Back</button>
        </div> -->
    </div>
</div>
