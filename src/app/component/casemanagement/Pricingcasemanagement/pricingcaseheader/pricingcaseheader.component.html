<div class="elearingnewui">
    <div class="case-management-body-forheader">
        <div class="returnbtn-element">
            <div class="returnbtn" (click)="GoBack()"> Return to Case Management </div>
        </div>
        <div class="card case-management-body-card">
            <div class="card-body">
                <div class=" tab-content-body">
                    <ul class="nav second-nav" role="tablist">
                        <li class="nav-item active" role="presentation" data-bs-target="#market" data-bs-toggle="tab"
                            aria-controls="market" role="tab" aria-selected="false" (click)="search('market')">
                            <span class="nav-link" aria-current="page">Market</span>
                        </li>
                        <li class="nav-item " role="presentation" data-bs-target="#initiate" data-bs-toggle="tab"
                            aria-controls="initiate" role="tab" aria-selected="false" (click)="search('initiate')">
                            <span class="nav-link" aria-current="page">Initiate</span>
                        </li>
                        <li class="nav-item " role="presentation" data-bs-target="#innovate" data-bs-toggle="tab"
                            aria-controls="innovate" role="tab" aria-selected="false" (click)="search('innovate')">
                            <span class="nav-link" aria-current="page">Innovate</span>
                        </li>
                        <li class="nav-item " role="presentation" data-bs-target="#adapt" data-bs-toggle="tab"
                            aria-controls="adapt" role="tab" aria-selected="false" (click)="search('adapt')">
                            <span class="nav-link" aria-current="page">Adapt</span>
                        </li>
                        <li class="nav-item" role="presentation" data-bs-target="#foodrforthought" data-bs-toggle="tab"
                            aria-controls="foodrforthought" role="tab" aria-selected="false"
                            (click)="search('foodforthought')">
                            <span class="nav-link" aria-current="page">Food For Thought</span>
                        </li>
                        <li class="nav-item" role="presentation" data-bs-target="#module" data-bs-toggle="tab"
                            aria-controls="module" role="tab" aria-selected="false" (click)="search('general')">
                            <span class="nav-link" aria-current="page">Module</span>
                        </li>

                    </ul>
                </div>
                <div class="tab-content tab-content-body">

                    <div role="tabpanel" class="tab-pane fade show active" id="market"
                        [ngClass]="{ 'active':activeTab==='market'}">
                        <app-pricingcasemarket *ngIf="activeTab==='market'"></app-pricingcasemarket>
                    </div>
                    <div role="tabpanel" class="tab-pane fade show " id="initiate"
                        [ngClass]="{ 'active':activeTab==='initiate'}">
                        <app-pricingcaseinitiate *ngIf="activeTab==='initiate'"></app-pricingcaseinitiate>
                    </div>
                    <div role="tabpanel" class="tab-pane fade show " id="innovate"
                        [ngClass]="{ 'active':activeTab==='innovate'}">
                        <app-pricingcaseinnovate *ngIf="activeTab==='innovate'"></app-pricingcaseinnovate>
                    </div>
                    <div role="tabpanel" class="tab-pane fade show " id="adapt"
                        [ngClass]="{ 'active':activeTab==='adapt'}">
                        <app-pricingcaseadapt *ngIf="activeTab==='adapt'"></app-pricingcaseadapt>
                    </div>

                    <div role="tabpanel" class="tab-pane fade show " id="foodrforthought"
                        [ngClass]="{ 'active':activeTab==='foodforthought'}">
                        <app-pricingcasefoodforthought
                            *ngIf="activeTab==='foodforthought'"></app-pricingcasefoodforthought>
                    </div>
                    <div role="tabpanel" class="tab-pane fade show " id="module"
                        [ngClass]="{ 'active':activeTab==='general'}">
                        <app-pricingcasemodule *ngIf="activeTab==='general'"></app-pricingcasemodule>
                    </div>
                </div>
            </div>
        </div>
        <!-- <div>
            <button class="mt-4 back" (click)="back()" style=" border: 3px solid #30b4cc;
            border-radius: 6px;
            background: transparent;
            color: #30b4cc;
            font-size: 20px; padding: 0.5rem 1rem;">Back</button>
        </div> -->
    </div>
</div>
