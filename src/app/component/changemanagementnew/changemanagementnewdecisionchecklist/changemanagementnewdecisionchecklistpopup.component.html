<div class="card logistics-decisionchecklistpopup" [ngClass]="data.class?data.class:''">
    <div class="loadingscreen" *ngIf="checkloading">
        <span class="spinner-border spinner-border-sm loadingspinner" role="status" aria-hidden="true"></span>
        <!-- <p class="loadingspinnertxt">Loading... Brewing up some digital magic! </p> -->
    </div>
    <div class="card-header decisionchecklistpopup-card-header">
        <div>
            <p class="decisionchecklistpopup-card-header-pclass">{{languageselect === "EU"
                ? "Help"
                : "Help"}}</p>
        </div>
        <div>
            <i class="bi bi-x-circle cross-circle" (click)="close()"></i>
        </div>
    </div>
    <div class="card-body">
        <p>
            {{languageselect === "EU"
            ? "You are submitting your decisions as the final decision. Do you want to save and proceed with
            reports?"
            : "You are submitting your decisions as the final decision. Do you want to save and proceed with
            reports?"}}
        </p>
    </div>
    <div class="card-footer decisionchecklistpopup-card-footer py-3">
        <div><button type="button" class=" close_btn" mat-dialog-close>{{languageselect === "EU"
                ? "Close"
                : "Close"}}</button></div>
        <div><button type="button" class=" save_btn" (click)="save()">{{languageselect === "EU"
                ? "Save & Proceed"
                : "Save & Proceed"}}</button>
            <div class="loadingscreen" *ngIf="checkloading">
                <span class="spinner-border spinner-border-sm loadingspinner" role="status" aria-hidden="true"></span>
                <!-- <p class="loadingspinnertxt">Loading... Brewing up some digital magic! </p> -->
            </div>
        </div>
    </div>

</div>
