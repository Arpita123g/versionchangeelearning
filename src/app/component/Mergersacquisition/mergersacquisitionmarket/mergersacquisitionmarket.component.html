<div class="elearingnewui Mergers_acquisition">
    <div class="loadingscreen" *ngIf="checkloading">
        <span class="spinner-border spinner-border-sm loadingspinner" role="status" aria-hidden="true"></span>
        <p class="loadingspinnertxt">Loading... Brewing up some digital magic! </p>
    </div>
    <div class="container">
        <div class="body-element">
            <div class="element-first">
                <div class="row">
                    <div class="marpoint1st" (click)="openDialog()" *ngIf="foodforthought">
                        <span class="food-thought-span"><i class="bi bi-bar-chart-fill"></i>
                            <button class="food-thought-btn">Food For Thought</button></span>
                    </div>
                </div>
            </div>

            <div class="row row-cols-md-2 intro_nd">
                <div class=" col-md intro">
                    <div class="intro-text">
                        <p class="marketpage-p" [innerHTML]="contentvalue"></p>
                       
                    </div>
                </div>
                <div class=" col-md ">
                    <div class="col-md  img-col">
                        <div>
                            <div class="circle-pic-div text-align-centre">
                                <img src="assets/images/mergrsaquisition/merketimage.png" class="img-fluid"
                                    style=" width: 90%;">
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
