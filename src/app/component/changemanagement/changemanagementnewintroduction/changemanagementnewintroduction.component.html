<!-- new -->
<div class="elearingnewui change_management">
    <div class="container">
        <div class="body-element indroduction-tab">
            <div class="element-first">
                <div class="row">
                    <div class="introductn" (click)="openDialog()" *ngIf="foodforthought">
                        <span class="food-thought-span"><i class="bi bi-bar-chart-fill"></i>
                            <button class="food-thought-btn">Food For Thought</button></span>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md">
                    <h1 class="pb-5">How does it work?</h1>
                </div>
            </div>
            
            <div class="row row-cols-md-3 g-3">

                <div class="col-md" *ngFor="let card of cards; let i = index">
                    <div class="card crd1">
                        <div class="card-img-top img-top-new">
                            <img [src]="card.image" alt="..." class="img-fluid img-img">
                        </div>
                        <div class="card-body">
                            <h2 class="card-title">{{card.title}}</h2>
                            <p class="card-text">
                                {{showAll[i] ? card.text : card.truncatedText}}
                                <a type="button" (click)="toggleshow(i)" [style.color]="showAll[i] ? 'red' : 'blue'">
                                    {{showAll[i] ? 'Show Less' : 'Show More'}}
                                </a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
