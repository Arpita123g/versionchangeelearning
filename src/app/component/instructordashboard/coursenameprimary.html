
<div class="row row-cols-md-4 g-3 p-3">
    <div class="loadingscreen" *ngIf="checkloading">
        <span class="spinner-border spinner-border-sm loadingspinner" role="status" aria-hidden="true"></span>
        <p class="loadingspinnertxt">Loading... Brewing up some digital magic! </p>
    </div>
    <div class="col-md" *ngFor="let carddata of cardlistdata">
        <div class="card shadow gameselet-card" style="border: none; border-top: 10px;border-radius: 8px;">
            <!-- <div class="card-header gameselet-card-head" style="border: none;border-top-left-radius: 8px; border-top-right-radius: 8px; border-top:6px solid #ff1783; height: 5rem;">
                
                <table>
                    <thead>
                        <tr>
                            <td>
                                <h4 *ngIf="carddata.defaultcase=='yes'" style="color: green; margin-bottom: 0;">Default Case</h4>
                            </td>
                            </tr>
                    </thead>
                </table>
                <div class="row" style="display: flex; align-items: center; justify-content: space-between;">


                    <h4> Course Code : <strong>{{carddata.courseDetails.coursecode}}</strong> </h4>
                </div>
                
            </div> -->
            
            <div class="card-body gameselet-card-body"
                style="display: flex; align-items: center; justify-content: center;">
                <div class="image" style="width: 66px; 
        height: 66px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        box-shadow: 8px 12px 16px #89898980;
        position: relative;
        z-index: 0;
        ">
                    <img>
                </div>
            </div>
            <div class="card-footer gameselet-card-footer"
                style="border: none; text-align: center; background: transparent;">
                <div class=" " style="height: 65px; overflow: scroll; padding:0.5rem" >
                    <a *ngIf="carddata.defaultcase=='no'" style="font-size: 15px; font-weight: 600;">
                        {{carddata.coursename}}
                    </a>
                    <a *ngIf="carddata.defaultcase=='yes'" style="font-size: 15px; font-weight: 600;">
                        Default Case
                    </a>
                </div>
                <div class="py-2" style="display: flex; align-items: center; justify-content: space-between;">
                    <div>
                        Course Name
                    </div>
                    <div>
                        <mat-icon style="cursor: pointer;" (click)="CopyGame1(carddata)">content_copy
                        </mat-icon>
                    </div>
                </div>
                <div class="py-2" style="display: flex; align-items: center; justify-content: space-between;">
                    <div>
                        Case Management
                    </div>
                    <div>
                        <i style="font-size: 22px; cursor: pointer;" class="bi bi-file-earmark-ruled"
                            (click)="gotTocasemanagement(carddata)"></i>
                    </div>
                </div>
                <div style="text-align: right; padding:10px 0px">
                    <div class="checkbox-wrapper-31">
                        <input type="checkbox" (change)="primarygameselect(carddata)"
                            [checked]="carddata.asprimary==='yes'">
                        <svg viewBox="0 0 35.6 35.6">
                            <circle class="background" cx="17.8" cy="17.8" r="17.8"></circle>
                            <circle class="stroke" cx="17.8" cy="17.8" r="14.37"></circle>
                            <polyline class="check" points="11.78 18.12 15.55 22.23 25.17 12.87"></polyline>
                        </svg>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
