<!-- 
  App Component Template - Angular 17
  Main application shell with router outlet and global features
-->

<!-- Application Container -->
<div class="app-container" role="application">
  
  <!-- Global Loading Indicator -->
  <div class="global-loading" *ngIf="isLoading()" role="status" aria-live="polite">
    <div class="loading-spinner">
      <div class="spinner"></div>
      <span class="loading-text">Loading...</span>
    </div>
  </div>

  <!-- Global Error Handler -->
  <div class="global-error" *ngIf="hasError()" role="alert" aria-live="assertive">
    <div class="error-container">
      <div class="error-icon">⚠️</div>
      <div class="error-content">
        <h3>Something went wrong</h3>
        <p>{{ errorMessage() }}</p>
        <button 
          type="button" 
          class="error-retry-btn" 
          (click)="retryOperation()"
          aria-label="Retry operation">
          Try Again
        </button>
      </div>
    </div>
  </div>

  <!-- Main Application Content -->
  <main class="app-main" role="main">
    <!-- Router Outlet for Dynamic Content -->
    <router-outlet></router-outlet>
  </main>

  <!-- Global Toast Notifications -->
  <div class="toast-container" role="region" aria-label="Notifications">
    <div 
      *ngFor="let toast of toasts(); trackBy: trackToast" 
      class="toast"
      [class]="'toast--' + toast.type"
      role="alert"
      [attr.aria-live]="toast.type === 'error' ? 'assertive' : 'polite'">
      <div class="toast-content">
        <span class="toast-message">{{ toast.message }}</span>
        <button 
          type="button" 
          class="toast-close" 
          (click)="dismissToast(toast.id)"
          aria-label="Close notification"></button>
         </div>
    </div>
  </div>

  <!-- Skip to Main Content Link (Accessibility) -->
  <a 
    href="#main-content" 
    class="skip-link"
    *ngIf="showSkipLink()">
    Skip to main content
  </a>

  <!-- Keyboard Navigation Indicator -->
  <div 
    class="keyboard-nav-indicator" 
    *ngIf="showKeyboardNavIndicator()"
    role="status" 
    aria-live="polite">
    Keyboard navigation mode active
  </div>

</div>
