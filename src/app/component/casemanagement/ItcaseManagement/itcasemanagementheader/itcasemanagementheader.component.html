<div class="elearingnewui">
    <div class="case-management-body-forheader">
        <div class="returnbtn-element">
            <div class="returnbtn" (click)="GoBack()"> Return to Case Management </div>
        </div>
        <div class="card case-management-body-card">
            <div class="card-body">
                <div class=" tab-content-body">
                    <ul class="nav second-nav" role="tablist">
                        <li class="nav-item active" role="presentation" data-bs-target="#market" data-bs-toggle="tab"
                            aria-controls="market" role="tab" aria-selected="false" (click)="search('market')">
                            <span class="nav-link" aria-current="page">Market Outlook</span>
                        </li>
                        <li class="nav-item" role="presentation" data-bs-target="#systemarchitecture"
                            data-bs-toggle="tab" aria-controls="systemarchitecture" role="tab" aria-selected="false"
                            (click)="search('systemarchitecture')">
                            <span class="nav-link" aria-current="page">System Architecture</span>
                        </li>
                        <li class="nav-item" role="presentation" data-bs-target="#softwaredevelopment"
                            data-bs-toggle="tab" aria-controls="softwaredevelopment" role="tab" aria-selected="false"
                            (click)="search('softwaredevelopment')">
                            <span class="nav-link" aria-current="page">Software Development</span>
                        </li>
                        <li class="nav-item" role="presentation" data-bs-target="#security" data-bs-toggle="tab"
                            aria-controls="security" role="tab" aria-selected="false" (click)="search('security')">
                            <span class="nav-link" aria-current="page">Security</span>
                        </li>
                        <li class="nav-item" role="presentation" data-bs-target="#innovation" data-bs-toggle="tab"
                            aria-controls="innovation" role="tab" aria-selected="false" (click)="search('innovation')">
                            <span class="nav-link" aria-current="page">Innovation</span>
                        </li>
                        <li class="nav-item" role="presentation" data-bs-target="#foodrforthought" data-bs-toggle="tab"
                            aria-controls="foodrforthought" role="tab" aria-selected="false"
                            (click)="search('foodforthought')">
                            <span class="nav-link" aria-current="page">Food For Thought</span>
                        </li>
                        <li class="nav-item" role="presentation" data-bs-target="#module" data-bs-toggle="tab"
                            aria-controls="module" role="tab" aria-selected="false" (click)="search('general')">
                            <span class="nav-link" aria-current="page">Module</span>
                        </li>

                    </ul>
                </div>

                <div class="tab-content tab-content-body">
                    <div role="tabpanel" class="tab-pane fade show active" id="market"
                        [ngClass]="{ 'active':activeTab==='market'}">
                        <app-itcasemanagementmarketoutlook
                            *ngIf="activeTab==='market'"></app-itcasemanagementmarketoutlook>
                    </div>
                    <div role="tabpanel" class="tab-pane fade show " id="systemarchitecture"
                        [ngClass]="{ 'active':activeTab==='systemarchitecture'}">
                        <app-itcasemanagementsystemarchitecture
                            *ngIf="activeTab==='systemarchitecture'"></app-itcasemanagementsystemarchitecture>
                    </div>
                    <div role="tabpanel" class="tab-pane fade show " id="softwaredevelopment"
                        [ngClass]="{ 'active':activeTab==='softwaredevelopment'}">
                        <app-itcasemanagementsoftwaredevelopment
                            *ngIf="activeTab==='softwaredevelopment'"></app-itcasemanagementsoftwaredevelopment>
                    </div>
                    <div role="tabpanel" class="tab-pane fade show " id="security"
                        [ngClass]="{ 'active':activeTab==='security'}">
                        <app-itcasemanagementsucurity *ngIf="activeTab==='security'"></app-itcasemanagementsucurity>
                    </div>
                    <div role="tabpanel" class="tab-pane fade show " id="innovation"
                        [ngClass]="{ 'active':activeTab==='innovation'}">
                        <app-itcasemanagementinnovation
                            *ngIf="activeTab==='innovation'"></app-itcasemanagementinnovation>
                    </div>
                    <div role="tabpanel" class="tab-pane fade show " id="foodrforthought"
                        [ngClass]="{ 'active':activeTab==='foodforthought'}">
                        <app-itcasemanagementfoodforthought
                            *ngIf="activeTab==='foodforthought'"></app-itcasemanagementfoodforthought>
                    </div>
                    <div role="tabpanel" class="tab-pane fade show " id="module"
                        [ngClass]="{ 'active':activeTab==='general'}">
                        <app-itcasemanagementmodule *ngIf="activeTab==='general'"></app-itcasemanagementmodule>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
