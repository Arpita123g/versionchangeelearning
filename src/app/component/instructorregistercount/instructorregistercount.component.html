<div>
    @if (checkloading()) {
        <div class="loadingscreen">
            <span class="spinner-border spinner-border-sm loadingspinner" role="status" aria-hidden="true"></span>
            <p class="loadingspinnertxt">Loading... Brewing up some digital magic!</p>
        </div>
    }

    <mat-card class="inputcard-table" style="margin-top:20px;margin-bottom:10px">
        <div class="row" style="margin:10px 0px 20px 0px">
            <div class="col-4 mar-b" style="display: flex;align-items:center;justify-content:left">
                <mat-radio-group aria-label="Select an option" [ngModel]="searchFlag()" (ngModelChange)="onRadioChange($event)">
                    <mat-radio-button value="all">All</mat-radio-button>&nbsp;&nbsp;
                    <mat-radio-button value="played">Played</mat-radio-button>&nbsp;&nbsp;
                    <mat-radio-button value="notplayed">Not Played</mat-radio-button>
                </mat-radio-group>
            </div>
        </div>
        <!-- <mat-card class="inputcard">
        <div class="row">
            <div class="col-8">
                <div class="inputtitle"> Student Management Section</div>
                <div class="subtitle">You can check student management section</div>
            </div>
            
            
        </div>
    </mat-card> -->

        <mat-card class="inputcard-table" style="margin-top:20px;margin-bottom:10px">


            <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" id='exportTable'>

                <!-- Course Name Column -->
                <ng-container matColumnDef="studentname">
                    <th mat-header-cell *matHeaderCellDef> Student Name </th>
                    <td mat-cell *matCellDef="let element"> {{element.userRegister.username}} </td>
                </ng-container>



                <!-- maintenanceCharges Column -->
                <ng-container matColumnDef="studentmailid">
                    <th mat-header-cell *matHeaderCellDef> Student Mail ID </th>
                    <td mat-cell *matCellDef="let element"> {{element.userRegister.email}} </td>
                </ng-container>

                <ng-container matColumnDef="noofattempts">
                    <th mat-header-cell *matHeaderCellDef> Attempts Left </th>
                    <td mat-cell *matCellDef="let element"> {{element.numberofattemptsleft}} </td>
                </ng-container>

                <!-- mar Column -->
                <ng-container matColumnDef="createdat">
                    <th mat-header-cell *matHeaderCellDef> Created At </th>
                    <td mat-cell *matCellDef="let element"> {{element.createdat}} </td>
                </ng-container>





                <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns();"></tr>
            </table>
            <mat-paginator style="font-size:12px;margin:10px;display:flex;justify-content:center"
                [pageSizeOptions]="[5, 10, 20, 50, 100,500,dataSource.data.length]" showFirstLastButtons
                aria-label="Select page of periodic elements">
            </mat-paginator>
        </mat-card>
        </mat-card>
</div>
