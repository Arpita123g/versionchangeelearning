<div class="login">
    <mat-card class="logincontainer">
        <p class="logintitle"> Admin Login</p> 
        <form [formGroup]="drivelogingroup" class="form">
            <div class="col">
                
                <div style="margin-top:30px">
                    <div class="row-2 mt "  >
                        <p class="inputtitle">Email</p>
                        <div class="row">
                            <div class="col-1">
                                <mat-icon style="color:#c7bdbd" class="sidenav-icon" aria-hidden="false" aria-label="Example home icon">email</mat-icon>
                            </div>
                            <div class="col-11">
                                <input formControlName="email" class="form-control" class="log-input" type="email"/>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row-2 mt ">
                    <p class="inputtitle">Password</p> 
                    <div class="row">
                        <div class="col-1">
                            <mat-icon style="color:#c7bdbd" class="sidenav-icon" aria-hidden="false" aria-label="Example home icon">lock</mat-icon>
                        </div>
                        <div class="col-11">
                            <input formControlName="password" class="form-control" class="log-input" type="password"/>
                        </div>
                    </div>
                    
                </div>
                <br/><br/><br/>
                <div class="row-2 mt  center" >
                
                 <button  class="submit-button log" (click)="login()" #loginRef>Login</button>
                 </div>
                
               
            </div> 
        </form> 
    </mat-card>
</div>
