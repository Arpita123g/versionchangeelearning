
<div class="p-4">
    <div class="row">
        <div class="col-10">
            <div class="inputtitle">Update Password. </div>
            <div class="subtitle">You can update password with respective details</div>
        </div>
    </div>
    <form [formGroup]="createuserpasswordgroup" class="form">
        <div class="row" >
            <div class="borderbottom"></div>
            <div class="col-6 mar-b">
                <div class="lebel">Password </div>
                <input formControlName="password" class="form-control" type="password">
            </div>
            <div class="col-4"></div>
            <div class="col-2 mar-b save" style="display:flex;align-items:center">
                <button class="submit-button" (click)="update()">Update</button>
            </div>
        </div>
    </form>       
</div>
