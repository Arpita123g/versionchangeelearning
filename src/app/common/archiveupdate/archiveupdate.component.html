<div class="card logout-popup-not">
    <div class="card-header logout-popup-not-cardhead">
        <span>Archive course</span>
        <i class="bi bi-x-circle" mat-dialog-close></i>
    </div>
    <div class="card-body logout-popup-not-cardhead-cardbody">
        <p>{{message}}</p>
    </div>
    <div class="card-footer logout-popup-not-cardhead-cardfooter">
        <button class="btn-yes" (click)="archiveupdate()">{{archivebuttonname}}</button>
        <button class="btn-no" mat-dialog-close>Cancel</button>
    </div>
</div>
