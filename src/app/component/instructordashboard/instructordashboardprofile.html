<div class="dialog-card">
    <div class="row">
        <div class="col-10">
            <div class="inputtitle">Instructor Profile </div>
            <div class="subtitle">You can change your password</div>
        </div>
    </div>
    <form [formGroup]="instructorprofilegroup" class="form">
        <div class="row" >
            <div class="borderbottom"></div>
            <div class="col-6 mar-b">
                <div class="lebel">Instructor Name </div>
                <input  formControlName="instructorname" class="form-control"  
                type="text"  >
                 
               
            </div>
            <div class="col-6 mar-b">
                <div class="lebel">Instructor Email id </div>
                <input formControlName="instructoremailid" class="form-control" type="email">
            </div>
            <div class="col-4"></div>
            
        </div>

        <div class="row" >
            <div class="borderbottom"></div>
            <div class="col-6 mar-b">
                <div class="lebel"> password </div>
                <input formControlName="instructorpassword" class="form-control" type="password">
               
            </div>
            
        </div>
        <div class="row">
            <div class="col-10">
                <div class="inputtitle">Change Password </div>
                
            </div>
        </div>
        <div class="row" >
            <div class="borderbottom"></div>
            
           <div class="col-6 mar-b">
                <div class="lebel">New password </div>
                <input formControlName="newpassword" class="form-control" type="text">
            </div> 
            <div class="col-6 mar-b">
                <div class="lebel">Confirm password </div>
                <input formControlName="confirmpassword" class="form-control" type="text">
            </div> 
        </div>

        <div class="row" >
            <div class="borderbottom"></div>
            <!-- <div class="col-6 mar-b">
                <div class="lebel"> password </div>
                <input formControlName="instructorpassword" class="form-control" type="text">
               
            </div> -->
            <!-- <div class="col-6 mar-b">
                <div class="lebel">Change password </div>
                <input formControlName="instructoremailid" class="form-control" type="email">
            </div> -->
            <div class="col-4"></div>
            <div class="col-2 mar-b save" style="display:flex;align-items:center">
                <button class="submit-button" (click)="update()">Save</button>
            </div>
        </div>
        
    </form>       
</div>
