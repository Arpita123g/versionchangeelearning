<div class="conversation-container">
  <mat-card class="conversation-card">
    <mat-card-header>
      <mat-card-title>Interview Conversation</mat-card-title>
      <mat-card-subtitle>Round {{ currentRound() }}</mat-card-subtitle>
    </mat-card-header>
    
    <mat-card-content>
      <div class="conversation-content" *ngIf="!isLoading(); else loading">
        <div class="messages" *ngIf="conversationData().length > 0; else noData">
          <div class="message" *ngFor="let message of conversationData()">
            <div class="message-content">
              <p>{{ message.message }}</p>
              <span class="timestamp">{{ message.timestamp | date:'short' }}</span>
            </div>
          </div>
        </div>
        <ng-template #noData>
          <p class="no-data">No conversation data available</p>
        </ng-template>
      </div>
      <ng-template #loading>
        <div class="loading-spinner">
          <mat-spinner diameter="40"></mat-spinner>
        </div>
      </ng-template>
    </mat-card-content>

    <mat-card-actions>
      <button mat-button (click)="previousRound()" [disabled]="currentRound() <= 1">
        <mat-icon>arrow_back</mat-icon>
        Previous Round
      </button>
      <button mat-button (click)="nextRound()">
        Next Round
        <mat-icon>arrow_forward</mat-icon>
      </button>
    </mat-card-actions>
  </mat-card>
</div>
