
<mat-card class="example-card" style="width: 100%;">
    <mat-card-header>
        <div mat-card-avatar class="example-header-image"></div>
        <mat-card-title>{{userobj?.[0]?.username}}</mat-card-title>
        <mat-card-subtitle>{{userobj?.[0]?.email}}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
        <div style="display: flex;">
            <div style="width: 70%;">
                <img mat-card-image src="https://st.depositphotos.com/1269204/1219/i/600/depositphotos_12196477-stock-photo-smiling-men-isolated-on-the.jpg" alt="Photo of a Shiba Inu">
            </div>
            <div style="width: 30%;">
                <div class="lbl">
                    Name
                </div>
                <div class="val">
                    {{userobj?.[0]?.username}} 
                </div>
                <div class="lbl">
                    Gender
                </div>
                <div class="val">
                    {{userobj?.[0]?.gender}}
                </div>
                <div class="lbl">
                    Society
                </div>
                <div class="val">
                    {{userobj?.[0]?.flatorSociety?.name}}  
                </div>
                <div class="lbl">
                    Mobile
                </div>
                <div class="val">
                    {{userobj?.[0]?.mobilenumber}}
                </div>
                <div style="text-align: center;">
                    <button class="button-70" (click)="logout()">Logout</button>
                </div>
            </div>
        </div>
    </mat-card-content>
    <!-- <mat-card-actions>
        
    </mat-card-actions> -->
</mat-card>
