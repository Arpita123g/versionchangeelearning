<div class="elearingnewui">
    <div class="case-management-body-forheader">
        <div class="returnbtn-element">
            <div class="returnbtn" (click)="GoBack()"> Return to Case Management </div>
        </div>
        <div class="card case-management-body-card">
            <div class="card-body">
                <div class=" tab-content-body">
                    <ul class="nav second-nav" role="tablist">
                        <li class="nav-item active" role="presentation" data-bs-target="#market" data-bs-toggle="tab"
                            aria-controls="market" role="tab" aria-selected="false" (click)="search('market')">
                            <span class="nav-link" aria-current="page">Market</span>
                        </li>
                        <li class="nav-item" role="presentation" data-bs-target="#catalog" data-bs-toggle="tab"
                            aria-controls="catalog" role="tab" aria-selected="false" (click)="search('catalog')">
                            <span class="nav-link" aria-current="page">Catalog</span>
                        </li>
                        <li class="nav-item" role="presentation" data-bs-target="#marketing" data-bs-toggle="tab"
                            aria-controls="marketing" role="tab" aria-selected="false" (click)="search('marketing')">
                            <span class="nav-link" aria-current="page">Marketing</span>
                        </li>
                        <li class="nav-item" role="presentation" data-bs-target="#experience" data-bs-toggle="tab"
                            aria-controls="experience" role="tab" aria-selected="false" (click)="search('experience')">
                            <span class="nav-link" aria-current="page">Experience</span>
                        </li>
                        <li class="nav-item" role="presentation" data-bs-target="#operations" data-bs-toggle="tab"
                            aria-controls="operations" role="tab" aria-selected="false" (click)="search('operations')">
                            <span class="nav-link" aria-current="page">Operations</span>
                        </li>
                        <li class="nav-item" role="presentation" data-bs-target="#foodrforthought" data-bs-toggle="tab"
                            aria-controls="foodrforthought" role="tab" aria-selected="false"
                            (click)="search('foodforthought')">
                            <span class="nav-link" aria-current="page">Food For Thought</span>
                        </li>
                        <li class="nav-item" role="presentation" data-bs-target="#module" data-bs-toggle="tab"
                            aria-controls="module" role="tab" aria-selected="false" (click)="search('general')">
                            <span class="nav-link" aria-current="page">Module</span>
                        </li>

                    </ul>
                </div>
                <div class="tab-content tab-content-body">

                    <div role="tabpanel" class="tab-pane fade show active" id="market"
                        [ngClass]="{ 'active':activeTab==='market'}">
                        <app-ecommerccasemarket *ngIf="activeTab==='market'"></app-ecommerccasemarket>
                    </div>
                    <div role="tabpanel" class="tab-pane fade show " id="catalog"
                        [ngClass]="{ 'active':activeTab==='catalog'}">
                        <app-ecommerccasecatalog *ngIf="activeTab==='catalog'"></app-ecommerccasecatalog>
                    </div>
                    <div role="tabpanel" class="tab-pane fade show " id="marketing"
                        [ngClass]="{ 'active':activeTab==='marketing'}">
                        <app-ecommerccasemarketing *ngIf="activeTab==='marketing'"></app-ecommerccasemarketing>
                    </div>
                    <div role="tabpanel" class="tab-pane fade show " id="experience"
                        [ngClass]="{ 'active':activeTab==='experience'}">
                        <app-ecommerccaseexperience *ngIf="activeTab==='experience'"></app-ecommerccaseexperience>
                    </div>
                    <div role="tabpanel" class="tab-pane fade show " id="operations"
                        [ngClass]="{ 'active':activeTab==='operations'}">
                        <app-ecommerccaseoperation *ngIf="activeTab==='operations'"></app-ecommerccaseoperation>
                    </div>
                    <div role="tabpanel" class="tab-pane fade show " id="foodrforthought"
                        [ngClass]="{ 'active':activeTab==='foodforthought'}">
                        <app-ecommerccasefoodforthought
                            *ngIf="activeTab==='foodforthought'"></app-ecommerccasefoodforthought>
                    </div>
                    <div role="tabpanel" class="tab-pane fade show " id="module"
                        [ngClass]="{ 'active':activeTab==='general'}">
                        <app-ecommerccasemodule *ngIf="activeTab==='general'"></app-ecommerccasemodule>
                    </div>
                </div>
            </div>
        </div>
        <!-- <div>
            <button class="mt-4 back" (click)="back()" style=" border: 3px solid #30b4cc;
            border-radius: 6px;
            background: transparent;
            color: #30b4cc;
            font-size: 20px; padding: 0.5rem 1rem;">Back</button>
        </div> -->
    </div>
</div>
