
<div class="central p-4">
    <div class="row">
        <div class="col-8" style="align-self: center;">
            <div class="txt">
                Are you sure?
            </div>
        </div>
        <div class="col-4">
            <div class="row">
                <div class="col">
                    <div class="check">
                        <img src="assets/icons/check.svg" alt="check.svg" (click)="confirm(true)">
                    </div>
                </div>
                <div class="col">
                    <div class="close" alt="close.svg">
                        <img src="assets/icons/close.svg" alt="check.svg" (click)="confirm(false)">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
