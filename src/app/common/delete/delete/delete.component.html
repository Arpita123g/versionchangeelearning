<div class="card logout-popupp-ins">
  <div class="card-header logout-popup-not-cardhead">
      <span>{{data.heading}}</span>
      <i class="bi bi-x-circle" mat-dialog-close></i>
  </div>
  <div class="card-body">
      <p>{{data.body}}</p>
  </div>
  <div class="card-footer">
      <button class="btn-yes" (click)="confirm(true)">Yes</button>
      <button class="btn-no" (click)="confirm(false)">No</button>
  </div>
</div>
