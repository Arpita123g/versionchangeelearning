<div class="interview-ai-container">
  <mat-card class="main-card">
    <mat-card-header>
      <mat-card-title>AI Interview Management</mat-card-title>
    </mat-card-header>
    
    <mat-card-content>
      <div class="content-section">
        <h2>Welcome to AI Interview Management</h2>
        <p>This section allows you to manage AI-based interviews and their configurations.</p>
        
        <div class="action-buttons">
          <button mat-raised-button color="primary">
            <mat-icon>add</mat-icon>
            Create New Interview
          </button>
          
          <button mat-raised-button color="accent">
            <mat-icon>list</mat-icon>
            View All Interviews
          </button>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
