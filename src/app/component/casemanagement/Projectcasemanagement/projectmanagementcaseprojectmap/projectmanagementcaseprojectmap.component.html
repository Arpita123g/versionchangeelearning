<div class="elearingnewui casemanagement">
    <div class="case-management-body case-management-body-marketing ">
        <table class="table page-name">
            <thead>
                <tr>
                    <th>
                        <h2>Task</h2>
                    </th>
                </tr>
            </thead>
        </table>
        <div class=" table-responsive mb-3 mt-3">
            <table class="table case-management-table">
                <thead>
                    <tr>
                        <td></td>
                        <td *ngFor="let round of rounds">{{round}}</td>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th class="second-head" colspan="13">Task Name</th>
                    </tr>
                    <tr *ngFor="let task of taskList; let taskIndex = index">
                        <td>{{ task }}</td>
                        <td *ngFor="let value of res['h' + (7 + taskIndex)]; let i = index">
                            <textarea [value]="res['h' + (7 + taskIndex)][i]" #inputElement
                                [disabled]="defaultcase=='yes'"
                                (focusout)="writeMarketingValue('h' + (7 + taskIndex), i, inputElement.value)"></textarea>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
