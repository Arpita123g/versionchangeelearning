<div class="confirmation-dialog" role="dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description">
  <div class="dialog-header">
    <mat-icon [color]="getIconColor()" aria-hidden="true">{{ data.icon }}</mat-icon>
    <h2 id="dialog-title" class="dialog-title">{{ data.title }}</h2>
  </div>

  <div id="dialog-description" class="dialog-content">
    <p>{{ data.message }}</p>
  </div>

  <div class="dialog-actions">
    <button mat-button (click)="onCancel()" aria-label="Cancel">
      {{ data.cancelText }}
    </button>
    <button mat-raised-button [color]="getIconColor()" (click)="onConfirm()" aria-label="Confirm">
      {{ data.confirmText }}
    </button>
  </div>
</div>
