<div class="elearning update_student p-3" >
    <div class="row">
        <div class="col-10">
            <div class="inputtitle">Student Profile </div>
            <div class="sub-title">You can change your password</div>
        </div>
    </div>
    <form [formGroup]="updatestudenthomepage" class="form">
        <div class="row" >
            <div class="borderbottom"></div>
            <div class="col-6 mar-b">
                <div class="lebel">Student Name </div>
                <input formControlName="studentname" class="form-control" 
                type="text" disable>
                 
               
            </div>
            <div class="col-6 mar-b">
                <div class="lebel">Student Email id </div>
                <input formControlName="studentemailid" class="form-control" type="email">
            </div>
            <div class="col-4"></div>
            
        </div>

        <div class="row" >
            <div class="borderbottom"></div>
            <div class="col-6 mar-b">
                <div class="lebel"> password </div>
                <input formControlName="studentpassword" class="form-control" type="password">
               
            </div>
            
        </div>
        <div class="row mt-3">
            <div class="col-10">
                <div class="title">Change Password </div>
                
            </div>
        </div>
        <div class="row" >
            <div class="borderbottom"></div>
            
           <div class="col-6 mar-b">
                <div class="lebel">New password </div>
                <input formControlName="newpassword" class="form-control" type="text">
            </div> 
            <div class="col-6 mar-b">
                <div class="lebel">Confirm password </div>
                <input formControlName="confirmpassword" class="form-control" type="text">
            </div> 
        </div>

        <div class="row" >
            <div class="borderbottom"></div>
            <div class="col-4"></div>
            <div class="col-2 mar-b save" style="display:flex;align-items:center">
                <button class="submit-button" (click)="update()">Save</button>
            </div>
        </div>
        
    </form>       
</div>
