<div class="elearingnewui bus_iness">
    <div class="material-tab">
      <div class="body-element">
        <div class="material-tab-body">
          <div class="row pb-3">
            <div class="col-10"></div>
            <div class="col-2">
                <button mat-raised-button color="primary" (click)="fileupload()" class="upload-btn">
                    <mat-icon>cloud_upload</mat-icon>
                    <span>Material Upload</span>
                  </button>
            </div>
          </div>
  
          <div class="row">
            <div class="col-md-6">
              <h2>Instructor Manuals</h2>
              <div class="col-md" *ngFor="let data of adminmaterialList">
                <div class="card material-tab-card">
                  <div class="material-tab-card-d">
                    <h3>{{ data.headingname }}</h3>
                    <mat-icon title="View" (click)="fileview(data.fileurl)">
                      open_in_new
                    </mat-icon>
                  </div>
                  <p>{{ data.description }}</p>
                </div>
              </div>
            </div>
  
            <div class="col-md-6">
              <h2>Participant Material</h2>
              <div class="col-md" *ngFor="let data of instructormaterialList">
                <div class="card material-tab-card">
                  <div class="material-tab-card-d">
                    <h3>{{ data.headingname }}</h3>
                    <mat-icon title="View" (click)="fileviewstatic(data.fileurl)">
                      open_in_new
                    </mat-icon>
                  </div>
                  <p>{{ data.description }}</p>
                </div>
              </div>
  
              <h2 class="mt-3">Yours course Materials</h2>
              <div class="col-md" *ngFor="let data of instructormaterialList1">
                <div class="card material-tab-card">
                  <div class="material-tab-card-d">
                    <h3>{{ data.headingname }}</h3>
                    <div>
                      <mat-icon
                        *ngIf="data.fileurl || data.link"
                        title="View"
                        (click)="fileview(data.fileurl || data.link)">
                        open_in_new
                      </mat-icon>
                      <mat-icon
                        title="Delete"
                        (click)="deleteFile('webinstructor', 'instructor', data.materialid)">
                        delete
                      </mat-icon>
                    </div>
                  </div>
                  <p>{{ data.description }}</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
