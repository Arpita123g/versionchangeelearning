    <div class=" dialog-body p-3">
        <div >

            <textarea class="textareamsg" name="input"></textarea>
        </div>
        <div class="mt-3">
            
            Shared Case : <input class="input-style" type="checkbox" [checked]="isChecked"
                (change)="onCheckboxChange($event)">
        </div>
        <div class="case-t py-1">
            Author Name : <p>{{data.courseDetails.instructorname}}</p>
        </div>
        <div class="dialog-footer pt-2 ">
            <div class="logout-popup-not-cardhead-cardfooter">
                <button class="btn-yes" type="submit" (click)="assignsharedcase()">Save</button>
                <button class="btn-no" mat-dialog-close type="button">Cancel</button>
