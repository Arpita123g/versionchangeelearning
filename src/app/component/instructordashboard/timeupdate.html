<div style="padding: 24px;">
    <div class="row">
        <div class="col-10">
            <div class="inputtitle">Time Schedule </div>
            <div class="subtitle">You can update with respective details</div>
        </div>
    </div>
    <form [formGroup]="timegroup" class="form">
        <div class="row">
            <div class="borderbottom"></div>
            <div class="col-5 mar-b">
                <div class="lebel">Start Time </div>
                <input type="datetime-local" value="13-03-2023 15:05:08" id="appt" formControlName="starttime" class="form-control" name="appt" min="09:00" max="18:00" required>
            </div>
            <div class="col-5">
                <div class="lebel">End Time </div>
                <input type="datetime-local" id="appt" formControlName="endtime" class="form-control" name="appt" min="09:00" max="18:00" required>
                
            </div>
            <div class="col-2 pt-2 save" style="display:flex;align-items:center;margin: 0;">
                <button class="submit-button" (click)="timeAdd()">Update</button>
            </div>
        </div>
    </form>
</div>
