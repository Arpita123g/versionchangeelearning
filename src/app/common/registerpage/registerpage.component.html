<div class="loadingscreen" *ngIf="checkloading">
    <span class="spinner-border spinner-border-sm loadingspinner" role="status" aria-hidden="true"></span>
    <p class="loadingspinnertxt">Loading... Brewing up some digital magic! </p>
</div>
<div class="elearingnewui">
    <div class="login-body">
        <div class="card login-card">

            <div class="row row-cols-md-2 h-100">
                <div class="col-md-5">
                    <div class="img-term">
                        <div class="img-term-elemt">
                            <p>Do you already have an account?</p>
                            <button class="img-term-btn mt-2" 
                            
                            (click)="loginClick()">Login</button>
                        </div>

                    </div>
                </div>
                <div class="col-md-7" (keydown)="handleKeydown($event)">
                    <div class="logo-elem">
                        <img src="../../../assets/images/cesim_logo_new.svg" class="img-fluid">
                    </div>
                    <div class="form-div" (keyup.enter)="studentregister()" [formGroup]="studentreggroup">
                        <h1>New account</h1>
                        
                            <div class="row g-2">
                                <div class="col-md-6">
                                    <mat-form-field appearance="outline" class="w-100"
                                    >
                                        <mat-label>First name</mat-label>
                                        <input matInput placeholder="First name" formControlName="firstname">
                                    </mat-form-field>
                                </div>
                                <div class="col-md-6">
                                    <mat-form-field appearance="outline" class="w-100">
                                        <mat-label>Last name</mat-label>
                                        <input matInput placeholder="Last name" formControlName="lastname">
                                    </mat-form-field>
                                </div>
                            </div>
                       

                        <mat-form-field appearance="outline" class="mb-2 mt-2">
                            <mat-label>Email</mat-label>
                            <input matInput placeholder="Email" #input [value]="input.value.toLowerCase()"  formControlName="email"
                            name="email" pattern="[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,20}" (focusout)="emailvalidation()">
                        </mat-form-field>
                        <mat-form-field appearance="outline" class="mb-2">
                            <mat-label>Password</mat-label>
                            <input matInput type="password" formControlName="password" placeholder="Password">
                        </mat-form-field>
                        <mat-form-field appearance="outline" class="mb-3">
                            <mat-label>Coursecode</mat-label>
                            <input matInput formControlName="coursecode" placeholder="Coursecode" 
                            
                            >
                        </mat-form-field>
                        <button class="login-sub mt-2" (click)="studentregister()" [disabled]="isButtonDisabled">Create an account</button>
                        <!-- <button class="reg-btn mt-4 mb-2" (click)="cancel()">Cancel</button> -->
                    </div>

                </div>

            </div>
        </div>
        <!-- <div class="title-body">
            <p>If you are an instructor and would like to register, please click here.</p>
        </div> -->
    </div>
</div>
