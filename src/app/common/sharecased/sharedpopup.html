<div class="card logout-popup-not">

  <div class="card-header logout-popup-not-cardhead">
    <span class="card-title ">
      Copy
    </span>
    <i class="bi bi-x-lg" style="float: right; " (click)="closeDialog()"></i>
  </div>

  <div class="div-pad p-3">
    <div class="label pb-1">Case Description :</div>
    <textarea class="textareamsg" name="input"></textarea>
  </div>
  <div class="py-2 div-pad p-3">
    <div class="case-t py-1">
      Shared Case : <input class="input-style" type="checkbox" [checked]="isChecked" (change)="onCheckboxChange($event)">
    </div>

    <div class="case-t py-1">
      Author Name : <p>{{data.courseDetails.instructorname}}</p>
    </div>

  </div>
  <div class="logout-popup-not-cardhead-cardfooter p-3">
    <button type="reset" class="btn-yes " (click)="assignsharedcase()">Save</button>
    <button type="reset" class="btn-no" (click)="closeDialog()">Cancel</button>
  </div>
</div>
