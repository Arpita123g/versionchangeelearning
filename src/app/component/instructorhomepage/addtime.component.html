<div class="container">
    <div class="row">
        <div class="col-10">
            <div class="inputtitle">Time Schedule </div>
            <div class="subtitle">You can update with respective details</div>
        </div>
    </div>
    <form [formGroup]="timegroup" class="form">
        <div class="row">
            <div class="borderbottom"></div>
            <div class="col-5 mar-b">
                <div class="lebel">Start Time </div>
                <input type="datetime-local" formControlName="starttime" class="form-control" name="starttime" min="09:00" max="18:00" required>
            </div>
            <div class="col-5">
                <div class="lebel">End Time </div>
                <input type="datetime-local" formControlName="endtime" class="form-control" name="endtime" min="09:00" max="18:00" required>
                
            </div>
            <div class="col-2 mar-b save" style="display:flex;align-items:center">
                <button class="submit-button" (click)="timeAdd()" [disabled]="!timegroup.valid">Update</button>
            </div>
        </div>
    </form>
</div>
