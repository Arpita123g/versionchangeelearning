<div class = "updatetokendetails">
    <div class="row">
        <div class="col-10">
            <div class="inputtitle">Course Assign </div>
            <div class="subtitle">You can assign your course</div>
        </div>
    </div>
    <form [formGroup]="updatedetails" class="form" >
        <div class="row">
            <div class="borderbottom"></div>
            <div class="col-6 mar-b">
                <div class="lebel">Drive Email </div>
                <input formControlName="email" class="form-control" type="text">
            </div>

            <div class="col-6 mar-b">
                <div class="lebel">Client ID </div>
                <input formControlName="clientid" class="form-control" type="text">
            </div>

        </div>
        <div class="row">
            <div class="borderbottom"></div>
            <div class="col-6 mar-b">
                <div class="lebel">Refresh Token </div>
                <input formControlName="refreshtoken" class="form-control" type="text">
            </div>

            <div class="col-6 mar-b">
                <div class="lebel">Client Screct</div>
                <input formControlName="clientscrect" class="form-control" type="text">
            </div>

        </div>
        <div class="row">
            <div class="borderbottom"></div>

            <div class="col-3 mar-b">
                <div class="lebel">Status</div>
                <input formControlName="status" class="form-control"  type="text">
            </div>
            <div class="col-3 mar-b">
                <div class="lebel">User Limit</div>
                <input formControlName="userlimit" class="form-control"  type="text">
            </div>
            <div class="col-4"></div>
            <div class="col-2 mar-b save" style="display:flex;align-items:center">
                <button class="submit-button" (click)="update()">Update</button>
            </div>
        </div>
    </form>
</div>
