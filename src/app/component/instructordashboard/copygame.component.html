<div class="matopenc">
    <div class="matcloseo">
        <h3 class="card-title">
            Copy
            <i class="bi bi-x-lg" style="float: right; " mat-dialog-close></i>
        </h3>
        
    </div>
    <form class="form" [formGroup]="myForm">
        <div class="card-body">
            <div class="form-group">
                <div class="alert alert-custom alert-default" role="alert">
                    <div class="alert-icon"><i class="flaticon-warning text-primary"></i></div>
                    <div class="alert-text">
                        Enter a name for the copied case
                    </div>
                </div>
            </div>
        </div>
        <div class="form-group">
            <div class="input-group">
                <input type="text" class="form-control" placeholder="" formControlName="coursename" />
            </div>
            <span class="form-text text-muted"></span>
        </div>
        <div class="twobtncan">
            <button type="reset" class="btn btn-primary mr-2" (click)="CopyGame()">Copy</button>
            <button type="reset" class="btn btn-secondary" mat-dialog-close>Cancel</button>
        </div>       
    </form>
</div>
