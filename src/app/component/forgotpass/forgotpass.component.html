<!-- new design -->
<div class="elearingnewui">
    <div class="login-body">
        <div class="loadingscreen" *ngIf="checkloading">
            <span class="spinner-border spinner-border-sm loadingspinner" role="status" aria-hidden="true"></span>
            <p class="loadingspinnertxt">Loading... Brewing up some digital magic! </p>
        </div>
        <div class="card login-card">
            <div class="form-div" [formGroup]="forgotpassgroup">
                <h1>Forgot password</h1>
                <p class="form-p">Please enter an email you used for registering:</p>
                <mat-form-field appearance="outline" class="mt-2 mb-2">
                    <mat-label>Email</mat-label>
                    <input matInput placeholder="Email" formControlName="emailFormControl" #input
                        [value]="input.value.toLowerCase()" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}">
                    
                </mat-form-field>
                <button type="submit" class="login-sub"
                    
                    (click)="submit()">Send</button>
            </div>
        </div>
        <div class="d-flex justify-content-center" *ngIf="showsuccessalert">
            <div class="alert alert-success "style="position: absolute; bottom: 4rem; left: 50%; font-weight:600;
            transform: translateX(-50%);
            text-align: center;">
                <span>{{alertvalue}}</span>
            </div>
        </div>
    </div>
   
</div>
