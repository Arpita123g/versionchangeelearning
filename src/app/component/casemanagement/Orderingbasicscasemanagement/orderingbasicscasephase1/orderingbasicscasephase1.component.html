<div class="elearingnewui casemanagement">

        <div class=" table-responsive mb-3 mt-3">
            <table class="table case-management-table ">
                <thead>
                    <tr>
                        <td></td>
                        <td *ngFor="let round of rounds">{{round}}</td>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Outlook</td>
                        <td *ngFor="let capitaldata of res.d7; let i = index">
                            <textarea [value]="res.d7[i]" #inputElement [disabled]="defaultcase=='yes'"
                                (focusout)="writeMarketingValue('d7',i,inputElement.value)" style="height: 69px;
                                width: 25rem;
                            "></textarea>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

                        <td>Ordering Cost, INR</td>

                            <input [value]="res.e10[i]" #inputElement [disabled]="defaultcase=='yes'"

                        </td>
                    </tr>
                    <tr>
                        <td>Stockout Cost, INR
                        </td>
                        <td *ngFor="let capitaldata of res.e11; let i = index">
                            <input [value]="res.e11[i]" #inputElement [disabled]="defaultcase=='yes'"
                                (focusout)="writeMarketingValue('e11',i,inputElement.value)">
                        </td>
                    </tr>
